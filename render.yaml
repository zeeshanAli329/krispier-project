services:
  - type: web
    name: krispier-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        value: https://krispier-project.vercel.app
      - key: CORS_ORIGINS
        value: https://krispier-project.vercel.app
